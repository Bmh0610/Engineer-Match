# 场地地图 (main-copy 实车口径, 2026-10-29 定稿)
# 坐标系: 原点=启停区1摆车对位后的车道中心点(节点1), +y=启1出发车头方向(朝二维码板),
#         +x=启1出发车右侧(朝物料盘), 单位 mm。网格正交——实际停点偏差不进坐标。
# 均匀网格(850/825), 与实车实测腿长的差异留给联调校准(必要时加逐边 len)。
# 节点编号 1~9(蛇形+1): 1启1 2码 3启2 | 4粗加工 5中心 6物料盘 | 7启1行远角 8暂存 9启2行远角
# 逐边附加费(edges 第三项, 缺省0): 外圈宽车道好走 0.1 / 内十字窄车道风险 0.2 (方向已定),
#   只进选路代价不改执行距离; 数值待实车校准, 红线=同一路线费用总和 < 一次转向费(0.5)。
# rotation_sign: 地图系角度与物理转向方向的耦合符号——本图=镜像系(预填-1), 联调一次旋转实测锁定。
field: {size: 2400, lane_width: 400}
rotation_sign: -1

nodes:
  1: {name: qiting1, xy: [0, 0], type: home}
  2: {name: qr, xy: [0, 850], type: work}
  3: {name: qiting2, xy: [0, 1700], type: home}
  4: {name: rough, xy: [825, 1700], type: work}
  5: {name: center, xy: [825, 850], type: junction}
  6: {name: raw, xy: [825, 0], type: work}
  7: {name: corner_r1, xy: [1650, 0], type: corner}
  8: {name: buffer, xy: [1650, 850], type: work}
  9: {name: corner_r2, xy: [1650, 1700], type: corner}

# 外圈 8 条(宽车道 fee 0.1) + 内十字 4 条(窄车道 fee 0.2); 中心节点5度数4=绕行枢纽
edges: [[1, 6, 0.1], [6, 7, 0.1], [7, 8, 0.1], [8, 9, 0.1], [9, 4, 0.1],
        [4, 3, 0.1], [3, 2, 0.1], [2, 1, 0.1],
        [5, 6, 0.2], [5, 4, 0.2], [5, 8, 0.2], [5, 2, 0.2]]
